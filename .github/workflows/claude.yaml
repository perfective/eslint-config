name: Claude
on:
    issues:
        types: [opened, assigned, labeled]
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

jobs:
    claude:
        name: Work on the issue or PR
        # Start on an `@claude` mention or the `claude` label from a maintainer.
        # The job checks the author's role itself, before any step runs repository code;
        # the action checks write access again.
        if: >-
            (github.event_name == 'issues'
                && (github.event.action == 'labeled' && github.event.label.name == 'claude'
                    || contains(github.event.issue.body, '@claude')
                    && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
            || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
                && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
            || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')
                && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
            || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')
                && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
        # One run per issue or PR at a time; a newer request waits for the running one.
        concurrency:
            group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 60

        permissions:
            contents: write # Push the work branch
            pull-requests: write # Open and update the PR
            issues: write # Update the tracking comment
            id-token: write # Claude GitHub App token (its pushes trigger CI, unlike GITHUB_TOKEN)
            actions: read # Read the CI results of the PR

        steps:
            # On a Renovate PR, check out its head, so the installed dependencies match the PR's lockfile.
            # Other runs install from the default branch: the PR code of other authors never runs before the action.
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: >-
                      ${{ (github.event.issue.user.login || github.event.pull_request.user.login) == 'renovate[bot]'
                      && (github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number))
                      || '' }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26.13.1'

            # Renovate can push a lockfile that `npm ci` rejects; `npm install` then fixes it.
            - name: Install dependencies
              run: npm ci || npm install

            - name: Run Claude Code
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  label_trigger: claude
                  # The action denies npm commands on PRs whose author has no write access, bots included.
                  # Allow them on Renovate PRs only: their branches live in this repository,
                  # and CI already runs `npm ci` and the tests on them.
                  # PRs from outside contributors keep the restriction.
                  restrict_untrusted_prs: >-
                      ${{ (github.event.issue.user.login || github.event.pull_request.user.login) == 'renovate[bot]'
                      && 'false' || 'true' }}
                  # `claude/...` branches cannot coexist with the `claude` dev branch in git.
                  branch_prefix: claude-
                  # `main` requires signed commits: commit through the GitHub API, so GitHub signs the commits.
                  use_commit_signing: true
                  claude_args: |
                      --model claude-opus-5-5
                      --allowedTools
                      "Bash(npm install)"
                      "Bash(npm outdated)"
                      "Bash(npm ls:*)"
                      "Bash(npm view:*)"
                      "Bash(npm test)"
                      "Bash(npm test:*)"
                      "Bash(RULE_AUDIT_UPDATE=true npm test)"
                      "Bash(npm run lint)"
                      "Bash(npm run lint:build)"
                      "Bash(npm run test:build)"
                      "Bash(npm run dist)"
                      "Bash(git status)"
                      "Bash(git log:*)"
                      "Bash(git diff:*)"
                      "Bash(git show:*)"
                      "Bash(gh issue view:*)"
                      "Bash(gh pr view:*)"
                      "Bash(gh pr diff:*)"
                      "Bash(gh pr list:*)"
                      "Bash(gh pr edit * --add-label *)"
                      "Bash(gh pr edit * --remove-label *)"
                      "Bash(gh pr create --draft:*)"
                      "Bash(gh release view:*)"
                      "WebFetch(domain:github.com)"
                      "WebFetch(domain:raw.githubusercontent.com)"
                      "WebFetch(domain:www.npmjs.com)"
                      "WebFetch(domain:eslint.org)"
                      "WebFetch(domain:typescript-eslint.io)"
