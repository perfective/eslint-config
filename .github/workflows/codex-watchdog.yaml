name: Codex Review Watchdog
on:
    schedule:
        # Hourly. A head with no Codex review for two hours is flagged on the next run.
        - cron: '0 * * * *'
    workflow_dispatch:

jobs:
    watch:
        name: Flag pull requests Codex has not reviewed
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: codex-watchdog
            cancel-in-progress: true
        permissions:
            contents: read # Read the head commit time
            pull-requests: write # Comment and label
            issues: write # The help wanted label

        steps:
            # GITHUB_TOKEN only. No personal token and no `@codex` mention.
            # One comment and one `help wanted` per head: a later commit is flagged again, the same head is not,
            # so a maintainer who removes the label does not get it back on the next run.
            # Once Codex reviews the head, the watchdog removes the label only when it added that label
            # after the flag. A label from Dependency Review or Claude stays. The cleared comment is still posted.
            - name: Flag unreviewed heads
              working-directory: ${{ runner.temp }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  cutoff="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
                  pulls="${RUNNER_TEMP}/codex-watchdog-pulls.tsv"
                  gh api --paginate "/repos/${REPO}/pulls?state=open&per_page=100" \
                      --jq '.[] | [.number, .user.login, .head.ref, .head.sha, (.head.repo.full_name // "")] | @tsv' \
                      > "${pulls}"
                  while IFS=$'\t' read -r number author ref sha head_repo; do
                      [ -n "${number}" ] || continue
                      if [ "${head_repo}" != "${REPO}" ]; then
                          continue
                      fi
                      if [ "${author}" = "renovate[bot]" ]; then
                          :
                      elif [ "${author}" = "claude[bot]" ] && [[ "${ref}" =~ ^claude-issue-[0-9]+- ]]; then
                          :
                      else
                          continue
                      fi
                      if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
                          echo "PR #${number} has no commit id." >&2
                          continue
                      fi
                      committed="$(gh api "/repos/${REPO}/commits/${sha}" --jq '.commit.committer.date')"
                      committed="$(printf '%s' "${committed}" | sed 's/\.[0-9]*//')"
                      if [ -z "${committed}" ] || [[ "${committed}" > "${cutoff}" ]]; then
                          echo "PR #${number} head ${sha} is newer than 2 hours."
                          continue
                      fi
                      prefix="${sha:0:10}"
                      # The commit id is 40 hex characters, so it is safe to embed in jq.
                      reviewed="$(gh api --paginate "/repos/${REPO}/pulls/${number}/reviews" \
                          --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]"
                              and .commit_id == "'"${sha}"'") | .id')"
                      if [ -z "${reviewed}" ]; then
                          reviewed="$(gh api --paginate "/repos/${REPO}/issues/${number}/comments" \
                              --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]")
                                  | select((.body | contains("'"${sha}"'"))
                                      or (.body | contains("Reviewed commit:** `" + "'"${prefix}"'")))
                                  | .id')"
                      fi
                      # Only this workflow's comments count. Another person's comment cannot silence it.
                      # The latest watchdog marker, as "flag <sha> <time>" or "clear <sha> <time>".
                      last="$(gh api --paginate "/repos/${REPO}/issues/${number}/comments" \
                          --jq '.[] | select(.user.login == "github-actions[bot]")
                              | select(.body | test("<!-- perfective-codex-watchdog"))
                              | [(if (.body | test("perfective-codex-watchdog-cleared:")) then "clear" else "flag" end),
                                  (.body | match("[0-9a-f]{40}") | .string),
                                  .created_at] | @tsv' \
                          | tail -n 1)"
                      IFS=$'\t' read -r last_kind last_sha last_at <<< "${last:-}"
                      if [ -n "${reviewed}" ]; then
                          echo "PR #${number} head ${sha} has a Codex review."
                          if [ "${last_kind:-}" != "flag" ]; then
                              continue
                          fi
                          # Remove the label only when this workflow added it after the flag.
                          # An earlier `help wanted` from Dependency Review or Claude stays.
                          labeled="$(gh api --paginate "/repos/${REPO}/issues/${number}/timeline" \
                              --jq '.[] | select(.event == "labeled" and (.label.name // "") == "help wanted")
                                  | [(.actor.login // ""), .created_at] | @tsv' \
                              | tail -n 1)"
                          IFS=$'\t' read -r label_actor label_at <<< "${labeled:-}"
                          if [ "${label_actor:-}" = "github-actions[bot]" ] \
                              && [ -n "${label_at:-}" ] && [[ "${label_at}" > "${last_at}" ]] \
                              && gh api "/repos/${REPO}/issues/${number}/labels" --jq '.[].name' \
                              | grep -qx 'help wanted'; then
                              gh pr edit "${number}" --remove-label "help wanted"
                          fi
                          gh pr comment "${number}" --body "$(printf '%s\n%s\n\n%s\n' \
                              "Codex reviewed the head commit \`${sha}\`," \
                              "so the watchdog flag on \`${last_sha}\` is cleared." \
                              "<!-- perfective-codex-watchdog-cleared: ${sha} -->")"
                          echo "Cleared the flag on PR #${number}."
                          continue
                      fi
                      marker="<!-- perfective-codex-watchdog: ${sha} -->"
                      if [ "${last_kind:-}" = "flag" ] && [ "${last_sha:-}" = "${sha}" ]; then
                          echo "PR #${number} was already flagged for ${sha}."
                          continue
                      fi
                      gh pr comment "${number}" --body "$(printf '%s\n%s\n\n%s\n%s\n\n%s\n' \
                          "The head commit \`${sha}\` has had no review" \
                          "from \`chatgpt-codex-connector[bot]\` for at least 2 hours." \
                          '**NEEDS HUMAN**: check Codex automatic reviews for this repository' \
                          '(Review all PRs, and the review trigger On every push). Drafts are not reviewed.' \
                          "${marker}")"
                      gh pr edit "${number}" --add-label "help wanted"
                      echo "Flagged PR #${number} (${sha})."
                  done < "${pulls}"
