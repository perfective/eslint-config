# Read from the pull request's base branch, not the PR head.
# Autofix stays off: Claude addresses Bugbot comments.
# Run Bugbot only when mentioned (a dashboard setting). This file cannot say that.
# `frequency: everyPush` would review the Renovate commit before Claude's dependency review.
version: 1

triggers:
    drafts: false

review:
    incremental: true

prSummary:
    mode: disabled

autofix:
    mode: disabled
